<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SRC Sports Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">SRC Sports Academy</div>
        <div id="hamburger-icon" aria-label="Open Menu">&#9776;</div>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="activities.html">New Activities</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="book.html">Book Online</a></li>
        </ul>
    </nav>

    <main class="form-container">
        <section class="sport-card">
            <h2>Join the Academy</h2>
            <form id="registration-form">
                <div class="input-group">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full-name" required aria-required="true">
                </div>

                <div class="input-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="sport">Select Sport:</label>
                    <select id="sport" name="sport">
                        <option value="football">Football</option>
                        <option value="taekwondo">Taekwondo</option>
                        <option value="judo">Judo</option>
                        <option value="volleyball">Volleyball</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to our newsletter</label>
                </div>

                <div class="captcha-box">
                    <p>Verification: <strong>4 + 2 = ?</strong></p>
                    <input type="number" id="captcha" placeholder="Enter answer" required>
                </div>

                <button type="submit" class="cta-btn">Register Now</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SRC Sports Academy | Visitors: <span id="visitor-count">0</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
